[pytest]
pythonpath = src/identity_api src/guardian src/mcp_server
testpaths = tests
# Unit tests run offline. The others need the running stack and real Entra tokens:
#   docker compose run --rm integration-tests
#   docker compose run --rm end-to-end-tests
addopts = -m "not integration and not end_to_end"
markers =
    integration: needs the running stack and real Entra tokens
    end_to_end: runs the whole guardian against the running stack
