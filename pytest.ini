[pytest]
pythonpath = src/identity_api src/guardian src/mcp_server
testpaths = tests
# Unit tests run offline. The others need the running stack and real Entra tokens:
#   docker compose run --rm integration-tests       (the Identity API, with real Entra tokens)
#   docker compose run --rm mcp-integration-tests   (the MCP tools, from the guardian's network)
addopts = -m "not integration"
markers =
    integration: needs the running stack and real Entra tokens
