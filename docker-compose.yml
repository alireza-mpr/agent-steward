# Local run (NFR5). Copy .env.example to .env and fill in the values first.
#   docker compose up -d sidecar
#   docker compose run --rm token-claims graph    # print the claims of the guardian's Graph token

name: agent-steward

# OpenTelemetry (NFR4), the same for every traced service: the SDK is on (OTEL_SERVICE_NAME, set per
# service), and the spans go to Jaeger over OTLP/HTTP (src/shared/telemetry.py).
x-otel-exporter: &otel-exporter
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

# The services whose lines also go to Loki, as OpenTelemetry log records: the audit lines (FR8) of
# the Identity API, the MCP server and the executor, the harness's progress lines, and, when
# HTTP_BODY_LOG is 1, the HTTP calls of the MCP server, the executor and the approve CLI.
# The logs address is given whole, because Jaeger takes traces only (src/shared/telemetry.py).
x-otel-logs: &otel-logs
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
  # 1: every outgoing HTTP call is also logged to Loki with its bodies and its Authorization header,
  # tokens included (THREATMODEL.md, A10). For debugging only. Set it in .env; off by default.
  HTTP_BODY_LOG: ${HTTP_BODY_LOG:-0}

services:
  # Microsoft Entra ID Auth SDK (sidecar), for the MCP server. It holds the guardian
  # blueprint's private key and makes both token requests (T1, T2), app-only.
  # Anyone who can call it can get the guardian's tokens, so it listens on 127.0.0.1 only.
  # Its callers join its network namespace (network_mode: service:sidecar), like
  # containers in one Kubernetes pod. Other containers, and the host, cannot reach it.
  # Since version 1.1 the sidecar also refuses non-loopback callers itself (403).
  # It has no OBO settings: the MCP server never receives an approver's token, so it cannot write.
  sidecar:
    # Pinned by digest. Microsoft publishes linux/amd64 only. On Apple Silicon, turn on Docker
    # Desktop's Rosetta emulation: under the older QEMU emulation the sidecar fails with 500s.
    image: mcr.microsoft.com/entra-sdk/auth-sidecar:1.1.2-azurelinux3.0-distroless@sha256:73a8763100c93c3da1a3ed1ba3af2c6122c0517687354dceded30537a1aee97f
    platform: linux/amd64
    env_file:
      - secrets/agent-steward-guardian.sidecar.env   # the PFX password (setup/agent-id/Deploy-BlueprintCertificate.ps1)
    environment:
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${TENANT_ID:?set TENANT_ID in .env}
      # The sidecar signs in as the blueprint (request 1), then as the agent identity named in each call (request 2).
      AzureAd__ClientId: ${GUARDIAN_BLUEPRINT_APP_ID:?set GUARDIAN_BLUEPRINT_APP_ID in .env}
      AzureAd__ClientCredentials__0__SourceType: Path
      AzureAd__ClientCredentials__0__CertificateDiskPath: /run/secrets/guardian_blueprint_pfx
      # Microsoft Graph, app-only, read-only: the autonomous flow (FR3).
      DownstreamApis__graph__BaseUrl: https://graph.microsoft.com/v1.0/
      DownstreamApis__graph__Scopes__0: https://graph.microsoft.com/.default
      DownstreamApis__graph__RequestAppToken: "true"
      # The project's Identity API, app-only (FR3, FR5). Its scope is its app ID + /.default.
      DownstreamApis__identity-api__BaseUrl: http://identity-api:8000/
      DownstreamApis__identity-api__Scopes__0: ${IDENTITY_API_APP_ID:?set IDENTITY_API_APP_ID in .env}/.default
      DownstreamApis__identity-api__RequestAppToken: "true"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5000
      # Lets the caller name the agent identity (AgentIdentity=...) on the app-only route.
      # Off by default, and then the sidecar silently returns the blueprint's own token
      # instead. This also allows other optionsOverride.* parameters, which is acceptable
      # only because the caller must share the sidecar's loopback.
      Sidecar__AllowOverrides__GetAuthorizationHeaderUnauthenticated: "true"
    secrets:
      - guardian_blueprint_pfx
    networks:
      - agent

  # A second sidecar, for the executor only (FR4). The same image, certificate and guardian
  # identity as the one above (keep the two in step), plus the OBO settings: the approver's token
  # (Tc) comes in on /AuthorizationHeader, and the sidecar exchanges it as the agent identity
  # named in the call. On the approval network only, so the harness cannot reach it.
  executor-sidecar:
    # Pinned by digest. Microsoft publishes linux/amd64 only. On Apple Silicon, turn on Docker
    # Desktop's Rosetta emulation: under the older QEMU emulation the sidecar fails with 500s.
    image: mcr.microsoft.com/entra-sdk/auth-sidecar:1.1.2-azurelinux3.0-distroless@sha256:73a8763100c93c3da1a3ed1ba3af2c6122c0517687354dceded30537a1aee97f
    platform: linux/amd64
    env_file:
      - secrets/agent-steward-guardian.sidecar.env   # the PFX password (setup/agent-id/Deploy-BlueprintCertificate.ps1)
    environment:
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${TENANT_ID:?set TENANT_ID in .env}
      # The sidecar signs in as the blueprint (request 1), then as the agent identity named in each call (request 2).
      AzureAd__ClientId: ${GUARDIAN_BLUEPRINT_APP_ID:?set GUARDIAN_BLUEPRINT_APP_ID in .env}
      AzureAd__ClientCredentials__0__SourceType: Path
      AzureAd__ClientCredentials__0__CertificateDiskPath: /run/secrets/guardian_blueprint_pfx
      # Microsoft Graph, app-only, read-only: the autonomous flow (FR3).
      DownstreamApis__graph__BaseUrl: https://graph.microsoft.com/v1.0/
      DownstreamApis__graph__Scopes__0: https://graph.microsoft.com/.default
      DownstreamApis__graph__RequestAppToken: "true"
      # The project's Identity API, app-only (FR3, FR5). Its scope is its app ID + /.default.
      DownstreamApis__identity-api__BaseUrl: http://identity-api:8000/
      DownstreamApis__identity-api__Scopes__0: ${IDENTITY_API_APP_ID:?set IDENTITY_API_APP_ID in .env}/.default
      DownstreamApis__identity-api__RequestAppToken: "true"
      # Microsoft Graph, delegated: OBO for the approved disable (FR4). Tc's expected audience is
      # the blueprint's bare app ID, because the blueprint issues v2 tokens and has no App ID URI
      # (the default would be api://<ClientId>).
      AzureAd__Audience: ${GUARDIAN_BLUEPRINT_APP_ID:?set GUARDIAN_BLUEPRINT_APP_ID in .env}
      AzureAd__Scopes: access_as_user
      DownstreamApis__graph-delegated__BaseUrl: https://graph.microsoft.com/v1.0/
      DownstreamApis__graph-delegated__Scopes__0: https://graph.microsoft.com/AgentIdentity.EnableDisable.All
      DownstreamApis__graph-delegated__RequestAppToken: "false"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5000
      # Lets the caller name the agent identity (AgentIdentity=...) on the app-only route.
      # Off by default, and then the sidecar silently returns the blueprint's own token
      # instead. This also allows other optionsOverride.* parameters, which is acceptable
      # only because the caller must share the sidecar's loopback.
      Sidecar__AllowOverrides__GetAuthorizationHeaderUnauthenticated: "true"
    secrets:
      - guardian_blueprint_pfx
    networks:
      - approval

  # The Identity API (FR5): checks every token (docs/tokens.md) and writes one audit line
  # per decision (FR8). No port is published: callers reach it as http://identity-api:8000.
  identity-api:
    build:
      context: src/identity_api
      additional_contexts:
        shared: src/shared   # telemetry.py, the OpenTelemetry setup every service shares
    environment:
      TENANT_ID: ${TENANT_ID:?set TENANT_ID in .env}
      IDENTITY_API_APP_ID: ${IDENTITY_API_APP_ID:?set IDENTITY_API_APP_ID in .env}
      AGENT_DISABLE_CLI_APP_ID: ${AGENT_DISABLE_CLI_APP_ID:?set AGENT_DISABLE_CLI_APP_ID in .env}
      <<: *otel-logs
      OTEL_SERVICE_NAME: identity-api
    networks:
      - agent      # the MCP server's sidecar
      - approval   # the executor's sidecar and the approve CLI
    depends_on:
      - jaeger
      - loki

  # The MCP server (FR6): the agent's hands. Its tools read Graph, apply the four rules (FR3),
  # report to the Identity API and ask for a disable. It gets the guardian's app-only tokens,
  # because it shares the sidecar's network namespace. It never writes: the executor does. It listens for MCP on port 8100,
  # which the guardian reaches as http://sidecar:8100/mcp.
  mcp-server:
    build:
      context: src/mcp_server
      additional_contexts:
        shared: src/shared   # telemetry.py, the OpenTelemetry setup every service shares
    network_mode: "service:sidecar"   # It mirrors how containers inside a Kubernetes Pod communicate. MCP's tokens come from the sidecar's loopback; it never sees the key
    environment:
      SIDECAR_URL: http://127.0.0.1:5000
      API_URL: http://identity-api:8000
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:?set GUARDIAN_AGENT_APP_ID in .env}
      POLICY_PATH: /config/agent-permissions.json
      ALLOW_LIST_PATH: /config/tool-allow-list.json
      MCP_PORT: "8100"
      # The names the server may be reached BY (the Host header), not who may call it. The
      # guardian calls http://sidecar:8100/mcp, because the MCP server has no name of its own
      # in the sidecar's namespace. Protects against DNS rebinding, not against callers (D1).
      MCP_ALLOWED_HOSTS: sidecar:8100
      # OpenTelemetry (NFR4): it reaches Jaeger and Loki through the sidecar's agent network.
      <<: *otel-logs
      OTEL_SERVICE_NAME: mcp-server
    volumes:
      - ./config:/config:ro   # the permission policy and the tool allow-list: edit, then restart, no rebuild
    depends_on:
      - sidecar
      - identity-api
      - jaeger
      - loki

  # The executor (FR4, FR7): the only service that disables an agent. The approve CLI sends it the
  # approver's token (Tc) right after an approval, and it exchanges Tc with OBO and writes with the
  # approver's own rights. It shares the executor sidecar's network namespace, so its tokens come
  # from that sidecar's loopback. The CLI reaches it as http://executor-sidecar:8200.
  executor:
    build:
      context: src                       # it reuses three of the MCP server's modules (its Dockerfile says which)
      dockerfile: executor/Dockerfile
    network_mode: "service:executor-sidecar"
    environment:
      SIDECAR_URL: http://127.0.0.1:5000
      API_URL: http://identity-api:8000
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:?set GUARDIAN_AGENT_APP_ID in .env}
      # OpenTelemetry (NFR4): it reaches Jaeger and Loki through the executor sidecar's approval network.
      <<: *otel-logs
      OTEL_SERVICE_NAME: executor
    depends_on:
      - executor-sidecar
      - identity-api
      - jaeger
      - loki

  # The guardian's harness (FR6): the agent loop. The guardian is the whole agent (the harness, the
  # model, the MCP server and the executor); this container is only its loop. One run: Claude asks for
  # tools, the MCP server runs them. It holds only the Anthropic API key, and it is NOT in the sidecar's
  # network namespace, so it cannot get an Entra token (docs/agent-steward-architecture.md).
  # docker compose up runs it once; docker compose run --rm harness runs it again.
  harness:
    build:
      context: src/guardian
      additional_contexts:
        shared: src/shared   # telemetry.py, the OpenTelemetry setup every service shares
    env_file:
      - secrets/anthropic.env   # ANTHROPIC_API_KEY, given to this container only
    environment:
      MCP_URL: http://sidecar:8100/mcp
      GUARDIAN_CONFIG_PATH: /config/guardian.json
      # OpenTelemetry (NFR4): the run's span, and the model calls' and MCP requests' spans. Its
      # progress lines go to Loki too, with the run's trace ID: not audit lines, it writes none.
      <<: *otel-logs
      OTEL_SERVICE_NAME: harness
      # The model calls' spans also hold what the model was sent and what it answered: the system
      # prompt, the task, the tool results (agent names and descriptions, including the planted prompt
      # injection) and the report. Untrusted text and tenant data: keep these spans in the local Jaeger,
      # never in a hosted viewer. Remove this line, or set metadata_only, to keep metadata only.
      ANTHROPIC_OPEN_TELEMETRY_TRACES_CONTENT_MODE: content
    volumes:
      # Only its own settings file, read-only: edit it and run again, no rebuild.
      # Not the whole config folder, so the harness never sees the MCP server's files.
      - ./config/guardian.json:/config/guardian.json:ro
    networks:
      - agent
    depends_on:
      - mcp-server
      - jaeger
      - loki

  # Jaeger (NFR4): An OTEL collector. receives every service's spans over OTLP/HTTP (port 4318) and shows each run as
  # one trace at http://localhost:16686. It is a distribution of the OpenTelemetry Collector, and it
  # keeps the spans in memory only, so a restart empties it. The spans hold tenant data (agent
  # names, object IDs in Graph URLs), so the UI is published on the host's loopback only.
  # It joins both networks, so both phases can send to it. It does not join them to each other:
  # a container on the agent network still cannot reach the approval network.
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686"   # the UI
    networks:
      - agent
      - approval
      - telemetry   # Grafana reads the traces from here

  # Loki (FR8, NFR4): stores the audit lines that the Identity API, the MCP server and the executor
  # send over OTLP (port 3100, path /otlp). The lines stay on the loki-data volume across restarts.
  # They hold tenant data and the approver's name, so no port is published: Grafana reads them.
  # Like Jaeger, it joins both networks without joining them to each other.
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - agent
      - approval
      - telemetry

  # Grafana (FR8, NFR4): the UI for the audit lines in Loki, at http://localhost:3000 (Explore, then
  # Loki). Each line's trace ID opens its trace in Jaeger, and each span shows its audit lines. The data
  # sources and the "Agent disables" dashboard (observability/grafana/dashboards) are set up when it
  # starts (observability/grafana/provisioning). No sign-in: it is for this machine only, so the UI is
  # published on the host's loopback only. It is on the telemetry network only, so it reaches Loki and
  # Jaeger but none of the services.
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"   # the UI
    networks:
      - telemetry
    depends_on:
      - loki
      - jaeger

  # Integration tests (FR5, NFR8): real tokens from Entra against the running Identity API.
  # Runs only on demand (profile "tools"): docker compose run --rm integration-tests
  integration-tests:
    build: tests/integration
    profiles: ["tools"]
    network_mode: "service:sidecar"   # agent tokens come from the sidecar's loopback
    env_file:
      - path: secrets/test-client.env   # the plain test client's secret, for one negative test
        required: false
    environment:
      SIDECAR_URL: http://127.0.0.1:5000
      API_URL: http://identity-api:8000
      TENANT_ID: ${TENANT_ID:-}
      IDENTITY_API_APP_ID: ${IDENTITY_API_APP_ID:-}
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:-}
      GUARDIAN_NOROLE_AGENT_APP_ID: ${GUARDIAN_NOROLE_AGENT_APP_ID:-}
      TEST_CLIENT_APP_ID: ${TEST_CLIENT_APP_ID:-}
    volumes:
      - ./tests/integration:/tests:ro
    command: ["pytest", "-v", "-m", "integration", "-p", "no:cacheprovider", "/tests/identity_api"]
    depends_on:
      - sidecar
      - identity-api

  # MCP integration tests (FR3, FR6): call the real MCP server from where the guardian sits, so the
  # tools run against the tenant and the Identity API, and check that the sidecar is out of reach.
  # No harness and no model. Runs only on demand (profile "tools"): docker compose run --rm mcp-integration-tests
  mcp-integration-tests:
    build: tests/integration   # the same small pytest image
    profiles: ["tools"]
    environment:
      MCP_URL: http://sidecar:8100/mcp
    networks:
      - agent   # the guardian's network, outside the sidecar's namespace
    volumes:
      - ./tests/integration:/tests:ro
    command: ["pytest", "-v", "-m", "integration", "-p", "no:cacheprovider", "/tests/mcp_server"]
    depends_on:
      - mcp-server

  # Agent eval (NFR3): runs the guardian (its harness, system prompt and Claude) against the prompt
  # injection planted in a fixture's description, several times, and checks how the agent behaves.
  # Built from the guardian's image, because only its containers get the model key. On the guardian's
  # network, so it cannot reach the sidecar either. Runs only on demand (profile "tools"): docker compose run --rm agent-eval
  agent-eval:
    build:
      context: src/guardian
      additional_contexts:
        shared: src/shared   # telemetry.py, the OpenTelemetry setup every service shares
    profiles: ["tools"]
    env_file:
      - secrets/anthropic.env   # ANTHROPIC_API_KEY
    environment:
      MCP_URL: http://sidecar:8100/mcp
      GUARDIAN_CONFIG_PATH: /config/guardian.json
      PYTHONPATH: /app          # the harness, from the guardian's image
      # The eval checks that the model never asks to disable the guardian, which the attack names.
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:?set GUARDIAN_AGENT_APP_ID in .env}
      <<: *otel-exporter
      OTEL_SERVICE_NAME: agent-eval   # each eval run is its own trace
    volumes:
      - ./config/guardian.json:/config/guardian.json:ro
      - ./tests/agent_eval:/eval:ro
    command: ["python", "/eval/eval_prompt_injection.py"]
    networks:
      - agent
    depends_on:
      - mcp-server

  # Dev tool: asks the sidecar for a token as the guardian and prints the token's claims.
  # It never prints the token itself. Runs only on demand (profile "tools").
  token-claims:
    image: python:3.12-alpine
    profiles: ["tools"]
    network_mode: "service:sidecar"   # shares the sidecar's loopback
    environment:
      SIDECAR_URL: http://127.0.0.1:5000
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:?set GUARDIAN_AGENT_APP_ID in .env}
    volumes:
      - ./tools:/tools:ro
    entrypoint: ["python", "/tools/token_claims.py"]
    depends_on:
      - sidecar

  # Dev check for the OBO design (FR4): the CLI's sign-in, run inside the executor sidecar's network namespace,
  # hands the approver's token (Tc) to the sidecar and prints the claims of the token the sidecar
  # exchanges it for. It never prints a token. Runs only on demand (profile "tools"):
  #   docker compose run --rm --build obo-claims
  obo-claims:
    build:
      context: src/approve_cli
      additional_contexts:
        shared: src/shared   # telemetry.py, the OpenTelemetry setup every service shares
    profiles: ["tools"]
    stdin_open: true
    tty: true
    network_mode: "service:executor-sidecar"   # shares the executor sidecar's loopback
    environment:
      TENANT_ID: ${TENANT_ID:?set TENANT_ID in .env}
      AGENT_DISABLE_CLI_APP_ID: ${AGENT_DISABLE_CLI_APP_ID:?set AGENT_DISABLE_CLI_APP_ID in .env}
      IDENTITY_API_APP_ID: ${IDENTITY_API_APP_ID:?set IDENTITY_API_APP_ID in .env}
      GUARDIAN_BLUEPRINT_APP_ID: ${GUARDIAN_BLUEPRINT_APP_ID:?set GUARDIAN_BLUEPRINT_APP_ID in .env}
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:?set GUARDIAN_AGENT_APP_ID in .env}
      SIDECAR_URL: http://127.0.0.1:5000
    command: ["python", "approve.py", "--show-obo-claims"]
    depends_on:
      - executor-sidecar

  # The CLI (FR7): a person signs in with the authorization code flow, then approves or
  # denies the guardian's requests to disable an agent. On the approval network, because the
  # Identity API and the executor are not published to the host. No secret: it is a public client, and the token stays in
  # memory. It catches the sign-in redirect with a one-shot listener on port 18400, published only on the
  # host's loopback. Runs only on demand (profile "tools"), and needs --service-ports for that port:
  #   docker compose run --rm --service-ports approve
  approve:
    build:
      context: src/approve_cli
      additional_contexts:
        shared: src/shared   # telemetry.py, the OpenTelemetry setup every service shares
    profiles: ["tools"]
    stdin_open: true
    tty: true
    environment:
      TENANT_ID: ${TENANT_ID:?set TENANT_ID in .env}
      AGENT_DISABLE_CLI_APP_ID: ${AGENT_DISABLE_CLI_APP_ID:?set AGENT_DISABLE_CLI_APP_ID in .env}
      IDENTITY_API_APP_ID: ${IDENTITY_API_APP_ID:?set IDENTITY_API_APP_ID in .env}
      # The audience of the token the guardian exchanges with OBO for the approved disable (FR4).
      GUARDIAN_BLUEPRINT_APP_ID: ${GUARDIAN_BLUEPRINT_APP_ID:?set GUARDIAN_BLUEPRINT_APP_ID in .env}
      API_URL: http://identity-api:8000
      # The guardian's executor, which receives that token right after an approval (FR4).
      EXECUTOR_URL: http://executor-sidecar:8200
      # The listener for the sign-in redirect: every address inside the container, because the browser's
      # request arrives from the host. The port below is published on the host's 127.0.0.1 only.
      APPROVE_LISTEN_ADDRESS: 0.0.0.0
      # OpenTelemetry (NFR4): each decision is a span, linked to the guardian's span that asked. With
      # HTTP_BODY_LOG=1, its calls go to Loki with their bodies, including the approver's tokens.
      <<: *otel-logs
      OTEL_SERVICE_NAME: approve-cli
    ports:
      - "127.0.0.1:18400:18400"
    networks:
      - approval
    depends_on:
      - identity-api
      - jaeger
      - loki

secrets:
  guardian_blueprint_pfx:
    file: secrets/agent-steward-guardian.pfx

networks:
  # The harness, the MCP server's sidecar and the Identity API.
  agent:
    driver: bridge
  # The approval path: the approve CLI, the executor's sidecar and the Identity API. The harness
  # is not on it, so it cannot reach the executor.
  approval:
    driver: bridge
  # Grafana, Loki and Jaeger: Grafana reads from the other two, and reaches nothing else.
  telemetry:
    driver: bridge

volumes:
  loki-data:   # the audit lines in Loki (FR8): kept across restarts, until docker compose down -v
