# Local run (NFR5). Copy .env.example to .env and fill in the values first.
#   docker compose up -d sidecar
#   docker compose run --rm token-claims graph    # print the claims of the guardian's Graph token

name: agent-steward

services:
  # Microsoft Entra ID Auth SDK (sidecar). It is the only container that holds the
  # guardian blueprint's private key, and it makes both token requests (T1, T2).
  # Anyone who can call it can get the guardian's tokens, so it listens on 127.0.0.1 only.
  # Its callers join its network namespace (network_mode: service:sidecar), like
  # containers in one Kubernetes pod. Other containers, and the host, cannot reach it.
  # Since version 1.1 the sidecar also refuses non-loopback callers itself (403).
  sidecar:
    # Pinned by digest. Microsoft publishes linux/amd64 only. On Apple Silicon, turn on Docker
    # Desktop's Rosetta emulation: under the older QEMU emulation the sidecar fails with 500s.
    image: mcr.microsoft.com/entra-sdk/auth-sidecar:1.1.2-azurelinux3.0-distroless@sha256:73a8763100c93c3da1a3ed1ba3af2c6122c0517687354dceded30537a1aee97f
    platform: linux/amd64
    env_file:
      - secrets/agent-steward-guardian.sidecar.env   # the PFX password (setup/agent-id/Deploy-BlueprintCertificate.ps1)
    environment:
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${TENANT_ID:?set TENANT_ID in .env}
      # The sidecar signs in as the blueprint (request 1), then as the agent identity named in each call (request 2).
      AzureAd__ClientId: ${GUARDIAN_BLUEPRINT_APP_ID:?set GUARDIAN_BLUEPRINT_APP_ID in .env}
      AzureAd__ClientCredentials__0__SourceType: Path
      AzureAd__ClientCredentials__0__CertificateDiskPath: /run/secrets/guardian_blueprint_pfx
      # Microsoft Graph, app-only: the autonomous flow (FR3).
      DownstreamApis__graph__BaseUrl: https://graph.microsoft.com/v1.0/
      DownstreamApis__graph__Scopes__0: https://graph.microsoft.com/.default
      DownstreamApis__graph__RequestAppToken: "true"
      # The project's Identity API, app-only (FR3, FR5). Its scope is its app ID + /.default.
      DownstreamApis__identity-api__BaseUrl: http://api:8000/
      DownstreamApis__identity-api__Scopes__0: ${IDENTITY_API_APP_ID:?set IDENTITY_API_APP_ID in .env}/.default
      DownstreamApis__identity-api__RequestAppToken: "true"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5000
      # Lets the caller name the agent identity (AgentIdentity=...) on the app-only route.
      # Off by default, and then the sidecar silently returns the blueprint's own token
      # instead. This also allows other optionsOverride.* parameters, which is acceptable
      # only because the caller must share the sidecar's loopback.
      Sidecar__AllowOverrides__GetAuthorizationHeaderUnauthenticated: "true"
    secrets:
      - guardian_blueprint_pfx
    networks:
      - agent

  # The Identity API (FR5): checks every token (docs/tokens.md) and writes one audit line
  # per decision (FR8). No port is published: callers reach it as http://api:8000.
  api:
    build: src/identity_api
    environment:
      TENANT_ID: ${TENANT_ID:?set TENANT_ID in .env}
      IDENTITY_API_APP_ID: ${IDENTITY_API_APP_ID:?set IDENTITY_API_APP_ID in .env}
    networks:
      - agent

  # The MCP server (FR6): the agent's hands. Its tools read Graph, apply the four rules (FR3) and
  # report to the Identity API. It is the only part of the agent that can get the guardian's
  # tokens, because it shares the sidecar's network namespace. It listens for MCP on port 8100,
  # which the guardian reaches as http://sidecar:8100/mcp.
  mcp-server:
    build: src/mcp_server
    network_mode: "service:sidecar"   # It mirrors how containers inside a Kubernetes Pod communicate. MCP's tokens come from the sidecar's loopback; it never sees the key
    environment:
      SIDECAR_URL: http://127.0.0.1:5000
      API_URL: http://api:8000
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:?set GUARDIAN_AGENT_APP_ID in .env}
      POLICY_PATH: /config/agent-permissions.json
      ALLOW_LIST_PATH: /config/tool-allow-list.json
      MCP_PORT: "8100"
      # The names the server may be reached BY (the Host header), not who may call it. The
      # guardian calls http://sidecar:8100/mcp, because the MCP server has no name of its own
      # in the sidecar's namespace. Protects against DNS rebinding, not against callers (D1).
      MCP_ALLOWED_HOSTS: sidecar:8100
    volumes:
      - ./config:/config:ro   # the permission policy and the tool allow-list: edit, then restart, no rebuild
    depends_on:
      - sidecar
      - api

  # The guardian (FR6): the harness. One run of the agent loop: Claude asks for tools, the MCP
  # server runs them. It holds only the Anthropic API key, and it is NOT in the sidecar's
  # network namespace, so it cannot get an Entra token (docs/agent-architecture.md).
  # docker compose up runs it once; docker compose run --rm guardian runs it again.
  guardian:
    build: src/guardian
    env_file:
      - secrets/anthropic.env   # ANTHROPIC_API_KEY, given to this container only
    environment:
      MCP_URL: http://sidecar:8100/mcp
      GUARDIAN_CONFIG_PATH: /config/guardian.json
    volumes:
      # Only its own settings file, read-only: edit it and run again, no rebuild.
      # Not the whole config folder, so the harness never sees the MCP server's files.
      - ./config/guardian.json:/config/guardian.json:ro
    networks:
      - agent
    depends_on:
      - mcp-server

  # Integration tests (FR5, NFR8): real tokens from Entra against the running Identity API.
  # Runs only on demand (profile "tools"): docker compose run --rm integration-tests
  integration-tests:
    build: tests/integration
    profiles: ["tools"]
    network_mode: "service:sidecar"   # agent tokens come from the sidecar's loopback
    env_file:
      - path: secrets/test-client.env   # the plain test client's secret, for one negative test
        required: false
    environment:
      SIDECAR_URL: http://127.0.0.1:5000
      API_URL: http://api:8000
      TENANT_ID: ${TENANT_ID:-}
      IDENTITY_API_APP_ID: ${IDENTITY_API_APP_ID:-}
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:-}
      GUARDIAN_NOROLE_AGENT_APP_ID: ${GUARDIAN_NOROLE_AGENT_APP_ID:-}
      TEST_CLIENT_APP_ID: ${TEST_CLIENT_APP_ID:-}
    volumes:
      - ./tests/integration:/tests:ro
    command: ["pytest", "-v", "-m", "integration", "-p", "no:cacheprovider", "/tests/identity_api"]
    depends_on:
      - sidecar
      - api

  # MCP integration tests (FR3, FR6): call the real MCP server from where the guardian sits, so the
  # tools run against the tenant and the Identity API, and check that the sidecar is out of reach.
  # No harness and no model. Runs only on demand (profile "tools"): docker compose run --rm mcp-integration-tests
  mcp-integration-tests:
    build: tests/integration   # the same small pytest image
    profiles: ["tools"]
    environment:
      MCP_URL: http://sidecar:8100/mcp
    networks:
      - agent   # the guardian's network, outside the sidecar's namespace
    volumes:
      - ./tests/integration:/tests:ro
    command: ["pytest", "-v", "-m", "integration", "-p", "no:cacheprovider", "/tests/mcp_server"]
    depends_on:
      - mcp-server

  # Agent eval (NFR3): runs the guardian (its harness, system prompt and Claude) against the prompt
  # injection planted in a fixture's description, several times, and checks how the agent behaves.
  # Built from the guardian's image, because only its containers get the model key. On the guardian's
  # network, so it cannot reach the sidecar either. Runs only on demand (profile "tools"): docker compose run --rm agent-eval
  agent-eval:
    build: src/guardian
    profiles: ["tools"]
    env_file:
      - secrets/anthropic.env   # ANTHROPIC_API_KEY
    environment:
      MCP_URL: http://sidecar:8100/mcp
      GUARDIAN_CONFIG_PATH: /config/guardian.json
      PYTHONPATH: /app          # the harness, from the guardian's image
    volumes:
      - ./config/guardian.json:/config/guardian.json:ro
      - ./tests/agent_eval:/eval:ro
    command: ["python", "/eval/eval_prompt_injection.py"]
    networks:
      - agent
    depends_on:
      - mcp-server

  # Dev tool: asks the sidecar for a token as the guardian and prints the token's claims.
  # It never prints the token itself. Runs only on demand (profile "tools").
  token-claims:
    image: python:3.12-alpine
    profiles: ["tools"]
    network_mode: "service:sidecar"   # shares the sidecar's loopback
    environment:
      SIDECAR_URL: http://127.0.0.1:5000
      GUARDIAN_AGENT_APP_ID: ${GUARDIAN_AGENT_APP_ID:?set GUARDIAN_AGENT_APP_ID in .env}
    volumes:
      - ./tools:/tools:ro
    entrypoint: ["python", "/tools/token_claims.py"]
    depends_on:
      - sidecar

  # The approve command (FR7): a person signs in with the device code flow, then approves or
  # denies the guardian's requests to disable an agent. On the agent network, because the Identity
  # API is not published to the host. No secret: it is a public client, and the token stays in
  # memory. Runs only on demand (profile "tools"): docker compose run --rm approve
  approve:
    build: src/approve_cli
    profiles: ["tools"]
    stdin_open: true
    tty: true
    environment:
      TENANT_ID: ${TENANT_ID:?set TENANT_ID in .env}
      AGENT_DISABLE_CLI_APP_ID: ${AGENT_DISABLE_CLI_APP_ID:?set AGENT_DISABLE_CLI_APP_ID in .env}
      IDENTITY_API_APP_ID: ${IDENTITY_API_APP_ID:?set IDENTITY_API_APP_ID in .env}
      API_URL: http://api:8000
    networks:
      - agent
    depends_on:
      - api

secrets:
  guardian_blueprint_pfx:
    file: secrets/agent-steward-guardian.pfx

networks:
  agent:
    driver: bridge
