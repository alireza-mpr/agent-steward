<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="520" viewBox="0 0 1310 520" role="img" aria-labelledby="title desc">
  <title id="title">How Agent Steward works</title>
  <desc id="desc">Three phases in a row, above Microsoft Entra. 1. Propose, autonomous: Agent Steward reads the agent details in Entra and checks every agent for five risks and reports them. Four are rule-based checks: dormant, no sponsor, expiring credential and excessive permissions. One is a heuristic check: a poisoned description. A dormant or poisoned agent gets a disable request, which waits as a pending disable request. 2. Decide: the approver lists the pending requests, reviews each pending request, and approves or denies it. On deny, nothing changes. 3. Execute, on behalf of the approver: after an approval, the approver lends their rights with OBO, and Agent Steward disables the agent in Entra under its own identity, with the approver's rights.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; text-anchor: middle; }
    .ink { fill: #334155; }
    .line { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .head { fill: #64748b; }
    .box-text { fill: #0f172a; font-size: 16px; }
    .item { fill: #0f172a; font-size: 15px; }
    .title { font-size: 15px; font-weight: 600; }
    .phase { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    .label { font-size: 14px; }
    .small { font-size: 13px; }
    .caption { font-size: 13px; font-style: italic; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .agent { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .human { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .calm { fill: #f1f5f9; stroke: #64748b; stroke-width: 1; }
    .entra { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    .tag { fill: #fef3c7; stroke: #d97706; stroke-width: 1; }
    .tag-text { fill: #92400e; font-size: 12px; }
    .divider { stroke: #93c5fd; stroke-width: 1; }
    .frame-group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .phase-propose { fill: #2563eb; }
    .phase-decide { fill: #d97706; }
    .phase-execute { fill: #16a34a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #cbd5e1; }
      .line { stroke: #94a3b8; }
      .head { fill: #94a3b8; }
      .frame-group, .calm, .entra { stroke: #94a3b8; }
      .phase-propose { fill: #60a5fa; }
      .phase-decide { fill: #fbbf24; }
      .phase-execute { fill: #4ade80; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Phase headings -->
  <text class="phase phase-propose" x="205" y="28">1. PROPOSE</text>
  <text class="ink label" x="205" y="52"><tspan font-weight="600">Actor:</tspan> Agent Steward (Autonomous)</text>
  <text class="phase phase-decide" x="800" y="28">2. DECIDE</text>
  <text class="ink label" x="800" y="52"><tspan font-weight="600">Actor:</tspan> Approver (Human)</text>
  <text class="phase phase-execute" x="1135" y="28">3. EXECUTE</text>
  <text class="ink label" x="1135" y="52"><tspan font-weight="600">Actor:</tspan> Agent Steward</text>
  <text class="ink label" x="1135" y="72">(on behalf of the approver, OBO)</text>

  <g>
  <!-- 1. Propose: Agent Steward and its five checks -->
  <rect class="agent" x="30" y="90" width="350" height="304" rx="10"/>
  <text class="box-text title" x="205" y="114">🤖 Agent Steward</text>
  <text class="box-text" x="205" y="138">checks every agent for 5 risks</text>
  <text class="box-text" x="205" y="160">and reports them</text>
  <line class="divider" x1="46" y1="180" x2="364" y2="180"/>

  <rect class="frame-group" x="46" y="190" width="318" height="134" rx="6"/>
  <text class="ink caption start" x="60" y="206">Rule-based checks</text>
  <text class="item start" x="60" y="232">😴 Dormant</text>
  <rect class="tag" x="272" y="222" width="80" height="20" rx="10"/>
  <text class="tag-text" x="312" y="232">📨 request</text>
  <text class="item start" x="60" y="258">👻 No sponsor</text>
  <text class="item start" x="60" y="284">⏳ Expiring credential</text>
  <text class="item start" x="60" y="310">🔑 Excessive permissions</text>

  <rect class="frame-group" x="46" y="332" width="318" height="52" rx="6"/>
  <text class="ink caption start" x="60" y="346">Heuristic check</text>
  <text class="item start" x="60" y="368">☠️ Poisoned description</text>
  <rect class="tag" x="272" y="358" width="80" height="20" rx="10"/>
  <text class="tag-text" x="312" y="368">📨 request</text>

  <!-- 1 to the queue: the disable request waits -->
  <path class="line" d="M380,150 H471" marker-end="url(#arrow)"/>
  <text class="ink small" x="426" y="134">submits</text>

  <rect class="calm" x="475" y="112" width="130" height="76" rx="8"/>
  <text x="540" y="132" font-size="22">📨...📨</text>
  <text class="ink label" x="540" y="155">Disable requests</text>
  <text class="ink label" x="540" y="173">(pending)</text>

  <!-- The approver lists the pending requests -->
  <path class="line" d="M700,150 H609" marker-end="url(#arrow)"/>
  <text class="ink small" x="654" y="122">lists</text>
  <text class="ink small" x="654" y="136">requests</text>

  <!-- 2. Decide -->
  <rect class="human" x="700" y="110" width="200" height="80" rx="40"/>
  <text class="box-text title" x="800" y="128">🧑‍💼 Approver</text>
  <text class="box-text" x="800" y="150">reviews each</text>
  <text class="box-text" x="800" y="172">pending request</text>

  <path class="line" d="M800,190 V252" marker-end="url(#arrow)"/>
  <text class="ink label start" x="814" y="221">❌ denies</text>
  <rect class="calm" x="720" y="256" width="160" height="40" rx="6"/>
  <text class="box-text" x="800" y="276">Nothing changes</text>

  <!-- Decide to Execute: the approval and the approver's rights -->
  <path class="line" d="M900,150 H1016" marker-end="url(#arrow)"/>
  <text class="ink label" x="958" y="124">✅ approves</text>
  <text class="ink small" x="958" y="168">lends their rights</text>

  <!-- 3. Execute -->
  <rect class="agent" x="1020" y="110" width="250" height="80" rx="10"/>
  <text class="box-text title" x="1145" y="136">🤖 Agent Steward</text>
  <text class="box-text" x="1145" y="162">disables the flagged agent</text>

  <path class="line" d="M1145,190 V452" marker-end="url(#arrow)"/>
  <text class="ink label end" x="1131" y="404">🔒 writes the change</text>
  <text class="ink label end" x="1131" y="424">(own identity, approver's rights)</text>

  <!-- Propose to and from Entra, and the report -->
  <path class="line" d="M205,394 V452" marker-end="url(#arrow)"/>
  <text class="ink label start" x="219" y="423">reads agent details</text>

  <!-- Microsoft Entra: the base strip -->
  <rect class="entra" x="30" y="456" width="1240" height="50" rx="8"/>
  <text class="box-text title" x="650" y="481">Microsoft Entra: every agent identity in the tenant</text>
  </g>
</svg>
