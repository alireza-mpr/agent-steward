<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="330" viewBox="0 0 1098 330" role="img" aria-labelledby="title desc">
  <title id="title">How Agent Steward works</title>
  <desc id="desc">The agent scans the agent identities in Microsoft Entra for four risks: dormant, no sponsor, credential expiring and too many permissions. It writes a report and a disable request. An approver signs in and reviews each request. On approve, the agent disables the agent with the approver's rights. On deny, the agent stays as it is.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; text-anchor: middle; }
    .ink { fill: #334155; }
    .line { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .head { fill: #64748b; }
    .box-text { fill: #0f172a; font-size: 16px; }
    .title { font-size: 14px; font-weight: 600; }
    .label { font-size: 14px; }
    .end { text-anchor: end; }
    .agent { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .risk { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1; }
    .human { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .good { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .calm { fill: #f1f5f9; stroke: #64748b; stroke-width: 1; }
    .frame-entra { fill: none; stroke: #64748b; stroke-width: 2; }
    .frame-propose { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 4; }
    .frame-decide { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #cbd5e1; }
      .line { stroke: #94a3b8; }
      .head { fill: #94a3b8; }
      .frame-entra, .calm { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Agent identities in Microsoft Entra -->
  <rect class="frame-entra" x="10" y="24" width="160" height="272" rx="8"/>
  <text class="ink title" x="90" y="46">Agent identities</text>
  <text class="ink title" x="90" y="64">in Microsoft Entra</text>
  <rect class="risk" x="22" y="80" width="136" height="40" rx="6"/>
  <text class="box-text" x="90" y="100">😴 Dormant</text>
  <rect class="risk" x="22" y="128" width="136" height="40" rx="6"/>
  <text class="box-text" x="90" y="148">👻 No sponsor</text>
  <rect class="risk" x="22" y="176" width="136" height="50" rx="6"/>
  <text class="box-text" x="90" y="192">⏳ Credential</text>
  <text class="box-text" x="90" y="210">expiring</text>
  <rect class="risk" x="22" y="234" width="136" height="50" rx="6"/>
  <text class="box-text" x="90" y="250">🔑 Too many</text>
  <text class="box-text" x="90" y="268">permissions</text>

  <!-- Entra to the agent -->
  <path class="line" d="M170,125 H286" marker-end="url(#arrow)"/>
  <text class="ink label" x="228" y="93">🔍 scans</text>
  <text class="ink label" x="228" y="111">agent registry</text>

  <!-- The agent proposes -->
  <rect class="frame-propose" x="290" y="62" width="394" height="120" rx="8"/>
  <text class="ink title" x="487" y="80">🕵️ The agent proposes</text>
  <polygon class="agent" points="306,125 322,95 400,95 416,125 400,155 322,155"/>
  <text class="box-text" x="361" y="116">🤖 Agent</text>
  <text class="box-text" x="361" y="134">Steward</text>
  <path class="line" d="M416,125 H438" marker-end="url(#arrow)"/>
  <rect class="calm" x="442" y="105" width="96" height="40" rx="6"/>
  <text class="box-text" x="490" y="125">📋 Report</text>
  <path class="line" d="M538,125 H560" marker-end="url(#arrow)"/>
  <rect class="calm" x="564" y="100" width="104" height="50" rx="6"/>
  <text class="box-text" x="616" y="116">📨 Disable</text>
  <text class="box-text" x="616" y="134">request</text>

  <!-- The request goes to the approver -->
  <path class="line" d="M668,125 H720" marker-end="url(#arrow)"/>

  <!-- The approver decides -->
  <rect class="frame-decide" x="710" y="10" width="378" height="310" rx="8"/>
  <text class="ink title" x="899" y="32">⚖️ The approver decides</text>
  <rect class="human" x="724" y="90" width="124" height="70" rx="35"/>
  <text class="box-text" x="786" y="107">🧑‍💼 Approver</text>
  <text class="box-text" x="786" y="125">signs in and</text>
  <text class="box-text" x="786" y="143">reviews</text>

  <path class="line" d="M848,125 H856 V80 H932" marker-end="url(#arrow)"/>
  <text class="ink label" x="894" y="68">❌ deny</text>
  <rect class="calm" x="936" y="55" width="136" height="50" rx="6"/>
  <text class="box-text" x="1004" y="71">😌 Agent stays</text>
  <text class="box-text" x="1004" y="89">as it is</text>

  <path class="line" d="M848,125 H856 V170 H935" marker-end="url(#arrow)"/>
  <text class="ink label" x="894" y="158">✅ approve</text>
  <polygon class="agent" points="939,170 957,132 1051,132 1069,170 1051,208 957,208"/>
  <text class="box-text" x="1004" y="152">🤖 Agent</text>
  <text class="box-text" x="1004" y="170">Steward</text>
  <text class="box-text" x="1004" y="188">disables it</text>

  <path class="line" d="M1004,208 V252" marker-end="url(#arrow)"/>
  <text class="ink label end" x="994" y="222">with the</text>
  <text class="ink label end" x="994" y="238">approver's rights</text>
  <rect class="good" x="950" y="256" width="108" height="50" rx="6"/>
  <text class="box-text" x="1004" y="272">🔒 Agent</text>
  <text class="box-text" x="1004" y="290">disabled</text>
</svg>
