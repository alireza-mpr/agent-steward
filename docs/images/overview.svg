<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="256" viewBox="0 20 1760 236" role="img" aria-labelledby="title desc">
  <title id="title">How Agent Steward works</title>
  <desc id="desc">The agent scans the agent identities in Microsoft Entra for four risks: dormant, no sponsor, credential expiring and too many permissions. It writes a report and a disable request. An approver signs in and reviews each request. On approve, the agent disables the agent with the approver's rights. On deny, the agent stays as it is.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; text-anchor: middle; }
    .ink { fill: #334155; }
    .line { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .head { fill: #64748b; }
    .box-text { fill: #0f172a; font-size: 14px; }
    .title { font-size: 14px; font-weight: 600; }
    .label { font-size: 12px; }
    .agent { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .risk { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1; }
    .human { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .good { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .calm { fill: #f1f5f9; stroke: #64748b; stroke-width: 1; }
    .frame-entra { fill: none; stroke: #64748b; stroke-width: 2; }
    .frame-propose { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 4; }
    .frame-decide { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #cbd5e1; }
      .line { stroke: #94a3b8; }
      .head { fill: #94a3b8; }
      .frame-entra, .calm { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Agent identities in Microsoft Entra -->
  <rect class="frame-entra" x="10" y="53" width="260" height="172" rx="8"/>
  <text class="ink title" x="140" y="73">Agent identities in Microsoft Entra</text>
  <rect class="risk" x="22" y="89" width="113" height="50" rx="6"/>
  <text class="box-text" x="78.5" y="114">💤 Dormant</text>
  <rect class="risk" x="145" y="89" width="113" height="50" rx="6"/>
  <text class="box-text" x="201.5" y="114">👻 No sponsor</text>
  <rect class="risk" x="22" y="151" width="113" height="50" rx="6"/>
  <text class="box-text" x="78.5" y="167">⏳ Credential</text>
  <text class="box-text" x="78.5" y="185">expiring</text>
  <rect class="risk" x="145" y="151" width="113" height="50" rx="6"/>
  <text class="box-text" x="201.5" y="167">🔑 Too many</text>
  <text class="box-text" x="201.5" y="185">permissions</text>

  <!-- Entra to the agent -->
  <path class="line" d="M270,139 H446" marker-end="url(#arrow)"/>
  <text class="ink label" x="358" y="127">🔍 scans agent registry</text>

  <!-- The agent proposes -->
  <rect class="frame-propose" x="450" y="61" width="550" height="132" rx="8"/>
  <text class="ink title" x="725" y="83">🕵️ The agent proposes</text>
  <polygon class="agent" points="470,139 488,111 612,111 630,139 612,167 488,167"/>
  <text class="box-text" x="550" y="139">🤖 Agent Steward</text>
  <path class="line" d="M630,139 H666" marker-end="url(#arrow)"/>
  <rect class="calm" x="670" y="119" width="100" height="40" rx="6"/>
  <text class="box-text" x="720" y="139">📋 Report</text>
  <path class="line" d="M770,139 H806" marker-end="url(#arrow)"/>
  <rect class="calm" x="810" y="119" width="170" height="40" rx="6"/>
  <text class="box-text" x="895" y="139">📨 Disable request</text>

  <!-- The request goes to the approver -->
  <path class="line" d="M980,139 H1042" marker-end="url(#arrow)"/>

  <!-- The approver decides -->
  <rect class="frame-decide" x="1030" y="31" width="720" height="214" rx="8"/>
  <text class="ink title" x="1390" y="53">⚖️ The approver decides</text>
  <rect class="human" x="1046" y="109" width="160" height="60" rx="30"/>
  <text class="box-text" x="1126" y="130">🧑‍💼 Approver</text>
  <text class="box-text" x="1126" y="148">signs in and reviews</text>

  <path class="line" d="M1206,139 H1230 V91 H1306" marker-end="url(#arrow)"/>
  <text class="ink label" x="1262" y="81">❌ deny</text>
  <rect class="calm" x="1310" y="71" width="180" height="40" rx="6"/>
  <text class="box-text" x="1400" y="91">😌 Agent stays as it is</text>

  <path class="line" d="M1206,139 H1230 V193 H1306" marker-end="url(#arrow)"/>
  <text class="ink label" x="1262" y="181">✅ approve</text>
  <polygon class="agent" points="1310,193 1328,161 1442,161 1460,193 1442,225 1328,225"/>
  <text class="box-text" x="1385" y="184">🤖 Agent Steward</text>
  <text class="box-text" x="1385" y="202">disables it</text>

  <path class="line" d="M1460,193 H1610" marker-end="url(#arrow)"/>
  <text class="ink label" x="1535" y="181">with the approver's rights</text>
  <rect class="good" x="1614" y="173" width="124" height="40" rx="6"/>
  <text class="box-text" x="1676" y="193">🔒 Agent disabled</text>
</svg>
